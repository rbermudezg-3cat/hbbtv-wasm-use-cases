[package]
name = "spatial-navigation-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly implementation of spatial navigation algorithms"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.87"
js-sys = "0.3.64"
once_cell = "1.17.1"

[dependencies.web-sys]
version = "0.3.64"
features = [
  "console",
  "DomRect",
  "Window"
]

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
codegen-units = 1

[features]
default = ["console_error_panic_hook"]

[dependencies.console_error_panic_hook]
version = "0.1.7"
optional = true