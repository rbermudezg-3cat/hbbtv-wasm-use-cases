<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Spatial Navigation WebAssembly Demo</title>
  <style>
    body {
      width: 1280px;
      height: 720px;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .demo-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .demo-column {
      width: 100%;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(50, 20px);
      grid-gap: 2px;
      margin-bottom: 10px;
      max-height: 260px;
      overflow-y: auto;
    }

    .item {
      height: 20px;
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 8px;
    }

    .item:focus {
      background-color: #ffe0e0;
      outline: 2px solid red;
    }

    #log-container {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 300px;
      height: 150px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border-radius: 5px;
      padding: 10px;
      font-family: monospace;
      overflow: hidden;
      z-index: 1000;
    }

    #log {
      height: 100px;
      overflow-y: auto;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .stats {
      border-top: 1px solid #555;
      padding-top: 8px;
      font-weight: bold;
    }
  </style>
  <script>
    function clearList(technology) {
      document.getElementsByClassName("list-container-" + technology)[0].innerHTML = '';
      return new Promise((resolve) => {
        //setTimeout(() => {
        resolve();
        //}, 500); // Allow the DOM to update before resolving
      });
    }
    function insertElements(elements, technology) {
      return new Promise((resolve) => {
        //setTimeout(() => {
        document.getElementsByClassName("list-container-" + technology)[0].innerHTML = elements;
        resolve();
        //}, 500); // Allow the DOM to update before resolving
      });
    }
    // Cache for string buffer and animation control
    let jsColorOffset = 0;
    let animationRunning = false;
    let animationFrameId = null;

    function renderElements(totalElements, isWasm) {
      // Cancel any existing animation
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }

      // Set animation as running
      animationRunning = true;

      function animationLoop() {
        clearList('js').then(() => {
          let items = '';
          if (!isWasm) {
            window.startDebugTimer('renderElementsWithJS');

            // Clear the buffer and update offset just like in Wasm version
            jsColorOffset = (jsColorOffset + 1) % totalElements;

            // Generate items with color shifting like in the Wasm version
            for (let i = 1; i <= totalElements; i++) {
              // Calculate background color with shifting effect
              const position = (i + jsColorOffset) % totalElements;
              const factor = position / totalElements;
              const colorValue = Math.round(factor * 255);
              const color = `rgb(${colorValue}, ${colorValue}, ${colorValue})`;
              const textColor = factor < 0.5 ? 'white' : 'black';

              // Calculate border color with shifting blue tones
              const blueFactor = ((position + totalElements / 2) % totalElements) / totalElements; // Offset from background
              const blueValue = Math.round(50 + (blueFactor * 150)); // Range from 50-200 blue
              const borderColor = `rgb(0, 100, ${blueValue})`;

              // Append to buffer with border style
              items += `<div class="item" tabindex="0" 
                            style="background-color: ${color}; 
                                   color: ${textColor}; 
                                   border: 2px solid ${borderColor}">${i}</div>`;
            }

            window.endDebugTimer('renderElementsWithJS');
          } else {
            items = window.wasmNavigationHelper.renderNavigableElements(totalElements);
          }

          insertElements(items, 'js').then(() => {
            if (animationRunning) {
              //animationFrameId = requestAnimationFrame(animationLoop);
            }
          });
        });
      }

      // Start the animation loop
      animationLoop();
    }

    function stopAnimation() {
      animationRunning = false;
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
        //document.getElementsByClassName("render-action")[0].innerHTML = 'Start';
      }
    }

    function handleKeydown(event) {
      if (event.keyCode === 13) { // Enter key
        const focusedElement = document.activeElement;
        const NUMBER_OF_ELEMENTS = 200; // Number of elements to render

        // Stop any running animation first
        stopAnimation();

        if (focusedElement && focusedElement.classList.contains('render-action-js')) {
          renderElements(NUMBER_OF_ELEMENTS, false);
          focusedElement.innerHTML = 'Running JS';
        }
        else if (focusedElement && focusedElement.classList.contains('render-action-wasm')) {
          renderElements(NUMBER_OF_ELEMENTS, true);
          focusedElement.innerHTML = 'Running WASM';
        }
        else if (focusedElement && focusedElement.classList.contains('render-action-stop')) {
          stopAnimation();
          document.getElementsByClassName("render-action-js")[0].innerHTML = 'Start JS';
          document.getElementsByClassName("render-action-wasm")[0].innerHTML = 'Start WASM';
        }
      }
    }

    function initHbbTV() {
      var appMan = document.getElementById('oipfAppMan')
      if (appMan.getOwnerApplication) {
        const app = appMan.getOwnerApplication(document);
        try {
          app.show();
          app.activate();
        } catch (e) {

        }
        var keyset = app.privateData.keyset;
        keyset.setValue(keyset.NAVIGATION);
      }
      document.addEventListener('keydown', handleKeydown);
      document.getElementsByClassName("item").item(0).focus(); // Focus the first item
      renderElements(500, false);
    }
  </script>
  <object id="oipfAppMan" type="application/oipfApplicationManager"
    style="width:0px; height:0px; position:absolute; visibility:hidden;"></object>
</head>

<body onload="initHbbTV();">
  <h1>Spatial Navigation WebAssembly Demo</h1>
  <div class="options-container container">
    <div class="item render-action-js" tabindex="0">Start JS</div>
    <div class="item render-action-wasm" tabindex="0">Start WASM</div>
    <div class="item render-action-stop" tabindex="0">Stop</div>
  </div>
  <div class="demo-container">
    <div class="demo-column">
      <div class="list-container-js container"></div>
    </div>
  </div>
  <div id="log-container">
    <h3>Performance Logs</h3>
    <div id="log"></div>
    <div class="stats">Average: <span id="average">0.00</span> ms</div>
  </div>
  <script src="./polyfill/spatial-navigation-polyfill.js"></script>
  <script>
    // Performance logging functionality
    const maxLogEntries = 5;
    const durations = [];

    // Override the logging function
    function logDuration(startTime, functionName) {
      const endTime = performance.now();
      const duration = parseFloat((endTime - startTime).toFixed(2));
      const logDiv = document.getElementById("log");

      // Add to durations array for average calculation
      durations.push(duration);
      if (durations.length > 20) durations.shift(); // Keep last 20 values for average

      // Create log entry
      const logEntry = `${functionName}: ${duration} ms`;

      // Update log display
      if (logDiv) {
        // Only keep the latest entries
        const entries = logDiv.innerHTML.split('<br>').filter(entry => entry.trim() !== '');

        // Add new entry at the beginning
        entries.unshift(logEntry);

        // Keep only the latest entries
        while (entries.length > maxLogEntries) {
          entries.pop();
        }

        logDiv.innerHTML = entries.join('<br>');

        // Update average
        const avg = durations.reduce((a, b) => a + b, 0) / durations.length;
        document.getElementById("average").textContent = avg.toFixed(2);
      }
    }

    const log = document.querySelector("#log");
    window.debugTimers = {};
    window.debugTimersHistory = {};
    window.startDebugTimer = (id) => {
      window.debugTimers[id] = {
        start: performance.now()
      }
    }


    window.endDebugTimer = (id) => {
      const endTime = performance.now();
      const startTime = window.debugTimers[id].start;
      const duration = endTime - startTime;

      // Guardar el tiempo en el historial
      if (!window.debugTimersHistory[id]) {
        window.debugTimersHistory[id] = [];
      }
      window.debugTimersHistory[id].push(duration);

      // Mantener solo los últimos 20 valores
      if (window.debugTimersHistory[id].length > 100) {
        window.debugTimersHistory[id].shift();
      }

      // Calcular y mostrar la mediana
      // Actualizar el promedio en el elemento "average"
      log.innerHTML = 'JS: ' + calculateMedian(window.debugTimersHistory['renderElementsWithJS']) + '<br>' +
        'Wasm: ' + calculateMedian(window.debugTimersHistory['renderElementsWithWasm']);
    }

    // Función para calcular la mediana de un array
    function calculateMedian(values) {
      if (!values || values.length === 0) return 0;

      // Crear una copia del array y ordenarla
      const sorted = [...values].sort((a, b) => a - b);

      const middle = Math.floor(sorted.length / 2);

      if (sorted.length % 2 === 0) {
        // Si hay un número par de elementos, promediar los dos del medio
        return (sorted[middle - 1] + sorted[middle]) / 2;
      } else {
        // Si hay un número impar de elementos, devolver el del medio
        return sorted[middle];
      }
    }


    // Enable the spatial navigation polyfill
    // SpatialNavigation.init();
  </script>
  <script type="module" src="./index.js?v=hbbtv"></script>
