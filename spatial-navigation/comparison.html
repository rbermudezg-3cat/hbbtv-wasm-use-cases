<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Spatial Navigation WebAssembly Demo</title>
  <style>
    body {
      width: 1280px;
      height: 720px;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .demo-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .demo-column {
      width: 100%;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(50, 20px);
      grid-gap: 2px;
      margin-bottom: 10px;
      max-height: 260px;
      overflow-y: auto;
    }

    .container.options-container {
      grid-template-columns: repeat(3, 100px);
      grid-gap: 20px;
    }

    .item {
      height: 20px;
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 8px;
    }

    .item:focus {
      background-color: #ffe0e0;
      outline: 2px solid red;
    }

    /* Add these new styles for the options container items */
    .options-container .item {
      height: 30px;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .options-container .item:focus {
      background-color: #ff9090;
      outline: 3px solid red;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
      font-weight: bold;
    }

    .options-container .item.selected {
      background-color: #ffe0e0;
      border: 2px solid red;
      font-weight: bold;
    }

    #log-container {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 300px;
      height: 150px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border-radius: 5px;
      padding: 10px;
      font-family: monospace;
      overflow: hidden;
      z-index: 1000;
    }

    #log {
      height: 100px;
      overflow-y: auto;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .stats {
      border-top: 1px solid #555;
      padding-top: 8px;
      font-weight: bold;
    }
  </style>
  <script>
    function clearList(technology) {
      document.getElementsByClassName("list-container")[0].innerHTML = '';
      return new Promise((resolve) => {
        //setTimeout(() => {
          resolve();
        //}, 0);
      });
    }
    function insertElements(elements) {
      return new Promise((resolve) => {
        //setTimeout(() => {
          document.getElementsByClassName("list-container")[0].innerHTML = elements;
          resolve();
        //}, 0);
      });
    }
    // Cache for string buffer and animation control
    let jsColorOffset = 0;
    let animationRunning = false;
    let animationFrameId = null;

    function renderElements(totalElements) {
      clearList().then(() => {
        let items = '';

        // Clear the buffer and update offset just like in Wasm version
        jsColorOffset = (jsColorOffset + 1) % totalElements;

        // Generate items with color shifting like in the Wasm version
        for (let i = 1; i <= totalElements; i++) {
          // Calculate background color with shifting effect
          const position = (i + jsColorOffset) % totalElements;
          const factor = position / totalElements;
          const colorValue = Math.round(factor * 255);
          const color = `rgb(${colorValue}, ${colorValue}, ${colorValue})`;
          const textColor = factor < 0.5 ? 'white' : 'black';

          // Calculate border color with shifting blue tones
          const blueFactor = ((position + totalElements / 2) % totalElements) / totalElements; // Offset from background
          const blueValue = Math.round(50 + (blueFactor * 150)); // Range from 50-200 blue
          const borderColor = `rgb(0, 100, ${blueValue})`;

          // Append to buffer with border style
          items += `<div class="item" tabindex="0" 
                            style="background-color: ${color}; 
                                   color: ${textColor}; 
                                   border: 2px solid ${borderColor}">${i}</div>`;
        }
        insertElements(items).then(() => {

        });
      });

    }

    function handleKeydown(event) {
      if (event.keyCode === 13) { // Enter key
        const focusedElement = document.activeElement;
         // Clear any previous selection
         document.querySelectorAll('.options-container .item').forEach(item => {
          item.classList.remove('selected');
        });
        
        // Add selected class to the current element
        if (focusedElement && focusedElement.classList.contains('item')) {
          focusedElement.classList.add('selected');
        }
        if (focusedElement && focusedElement.classList.contains('navigate-action-js')) {
          setImplementationPreference('selectBestCandidate', 'js');
        }
        else if (focusedElement && focusedElement.classList.contains('navigate-action-wasm')) {
          setImplementationPreference('selectBestCandidate', 'wasm');
        }
        else if (focusedElement && focusedElement.classList.contains('navigate-action-comparison')) {
          setImplementationPreference('selectBestCandidate', 'compare');
        }
      }
    }

    function initHbbTV() {
      var appMan = document.getElementById('oipfAppMan')
      if (appMan.getOwnerApplication) {
        const app = appMan.getOwnerApplication(document);
        try {
          app.show();
          app.activate();
        } catch (e) {

        }
        var keyset = app.privateData.keyset;
        keyset.setValue(keyset.NAVIGATION);
      }
      document.addEventListener('keydown', handleKeydown);
      document.getElementsByClassName("item").item(0).focus(); // Focus the first item
      renderElements(5000);
    }
  </script>
  <object id="oipfAppMan" type="application/oipfApplicationManager"
    style="width:0px; height:0px; position:absolute; visibility:hidden;"></object>
</head>

<body onload="initHbbTV();">
  <h1>Spatial Navigation WebAssembly Demo</h1>
  <div class="options-container container">
    <div class="item selected navigate-action-comparison" tabindex="0">Comparison</div>
    <div class="item navigate-action-js" tabindex="0">Navigate with JS</div>
    <div class="item navigate-action-wasm" tabindex="0">Navigate with Wasm</div>
  </div>
  <div class="demo-container">
    <div class="demo-column">
      <div class="list-container container"></div>
    </div>
  </div>
  <div id="log-container">
    <h3>Performance Logs</h3>
    <div id="log"></div>
    <div class="stats">Average: <span id="average">0.00</span> ms</div>
  </div>
  <script src="./polyfill/spatial-navigation-polyfill.js"></script>
  <script>
    // Performance logging functionality
    const maxLogEntries = 5;
    const durations = [];


    const log = document.querySelector("#log");
    window.debugTimers = {};
    window.debugTimersHistory = {};
    window.startDebugTimer = (id) => {
      window.debugTimers[id] = {
        start: performance.now()
      }
    }


    window.endDebugTimer = (id) => {
      const endTime = performance.now();
      const startTime = window.debugTimers[id].start;
      const duration = endTime - startTime;

      // Guardar el tiempo en el historial
      if (!window.debugTimersHistory[id]) {
        window.debugTimersHistory[id] = [];
      }
      window.debugTimersHistory[id].push(duration);

      // Mantener solo los últimos 100 valores
      if (window.debugTimersHistory[id].length > 100) {
        window.debugTimersHistory[id].shift();
      }

    }

    // Set up an interval to update the metrics every 2 seconds
    setInterval(() => {
      if (window.debugTimersHistory['selectBestCandidate js'] || window.debugTimersHistory['selectBestCandidate wasm']) {
        const jsDuration = calculateMedian(window.debugTimersHistory['selectBestCandidate js'] || [])
        const wasmDuration = calculateMedian(window.debugTimersHistory['selectBestCandidate wasm'] || [])
        const navigationType = getImplementationPreference('selectBestCandidate');
        if(navigationType === 'wasm') {
          log.innerHTML = 'Wasm: ' + wasmDuration.toFixed(2) + ' ms';
        } else if (navigationType === 'js') {
          log.innerHTML = 'JS: ' + jsDuration.toFixed(2) + ' ms';
        } else {
          log.innerHTML = 'JS: ' + jsDuration.toFixed(2) + ' ms<br>' +
            'Wasm: ' + wasmDuration.toFixed(2) + ' ms<br>' +
            'Ratio: ' + (jsDuration / wasmDuration).toFixed(2) + 'x';
        }
      }
    }, 2000);

    // Función para calcular la mediana de un array
    function calculateMedian(values) {
      if (!values || values.length === 0) return 0;

      // Crear una copia del array y ordenarla
      const sorted = [...values].sort((a, b) => a - b);

      const middle = Math.floor(sorted.length / 2);

      if (sorted.length % 2 === 0) {
        // Si hay un número par de elementos, promediar los dos del medio
        return (sorted[middle - 1] + sorted[middle]) / 2;
      } else {
        // Si hay un número impar de elementos, devolver el del medio
        return sorted[middle];
      }
    }


    // Enable the spatial navigation polyfill
    // SpatialNavigation.init();
  </script>
