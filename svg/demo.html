        async function renderSvg(svgString, color) {
            if (!initialized) {
                initialized = true;
                await resvg.initWasm(fetch('https://unpkg.com/@resvg/resvg-wasm/index_bg.wasm'));

            const coloredSvg = svgString.replace('rgb(0,0,0)', color);

            const font = await fetch('./fonts/Pacifico-Regular.woff2');
            if (!font.ok) {
                console.error('Failed to load font');
                return;
            }

            const fontData = await font.arrayBuffer();
            const buffer = new Uint8Array(fontData);

            const opts = {
                fitTo: {
                    mode: 'width',
                    value: 800,
                },
                font: {
                    fontBuffers: [buffer],
                },
            };

            const resvgJS = new resvg.Resvg(coloredSvg, opts);
            const pngData = resvgJS.render();
            const pngBuffer = pngData.asPng();

            const svgURL = URL.createObjectURL(new Blob([pngBuffer], { type: 'image/png' }));
            document.getElementById('output').src = svgURL;
        }

        function interpolateColor(progress) {
            const r = Math.round(228 * progress);
            const g = Math.round(19 * progress);
            const b = Math.round(63 * progress);
            return `rgb(${r},${g},${b})`;
